[pytest]
# Merged from p2's backend/pytest.ini (asyncio_mode, needed by agent/'s async
# tests) and p5's root-level pytest.ini (pythonpath = .). `pythonpath` takes
# a list here: "." covers Part 4/5's `backend.x` imports (repo root on
# sys.path), "backend" covers Part 2's bare `shared.x` / `agent.x` imports
# (backend/ itself on sys.path) — both are needed at once. See conftest.py
# for the additional fix (module-identity aliasing) this doesn't cover.
asyncio_mode = auto
pythonpath = . backend
